name: _cleanup-orphaned-images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete orphaned images in nuhs-poc
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          for img in camunda-alp-backend camunda-alp-frontend; do
            echo "Deleting ${REGION}-docker.pkg.dev/${PROJECT_ID}/nuhs-poc/${img}"
            gcloud artifacts docker images delete \
              "${REGION}-docker.pkg.dev/${PROJECT_ID}/nuhs-poc/${img}" \
              --delete-tags --quiet || echo "  (not found or already gone, skipping)"
          done

      - name: Delete the unused camunda-compliance-review repo
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud artifacts repositories delete camunda-compliance-review \
            --location "$REGION" --project "$PROJECT_ID" --quiet || \
            echo "  (not found or already gone, skipping)"
